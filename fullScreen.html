<!--This is the full screen view for the photography gallery-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Gallery</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="fullScreenContainer">
        <img src="images/Photos/photo1.JPG" alt="Full Screen Image">
        <div class="Navigation">
            <a href="index.html" id="closeButton">
                <img src="images/Icons/xmark-solid.png" alt="Close">
            </a>
            <button id="prevButton">
                <img src="images/Icons/arrow-left-solid.png" alt="Previous">
            </button>
            <button id="nextButton">
                <img src="images/Icons/arrow-right-solid.png" alt="Next">
            </button>
            <button id="showCaption">
                <img src="images/Icons/angle-up-solid.png" alt="Show Caption">
            </button>
            <button id="hideCaption">
                <img src="images/Icons/angle-down-solid.png" alt="Hide Caption">
            </button>
        </div>
    </div>
</body>
</html>
